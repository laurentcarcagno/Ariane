[project]
name = "ariane-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.24", "pydantic>=2.9", "fastapi>=0.115", "uvicorn>=0.32", "python-multipart>=0.0.12", "pyjwt[crypto]>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests", "../plugins"]
pythonpath = [".", ".."]
